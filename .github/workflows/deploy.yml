name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Descargar el repositorio
              uses: actions/checkout@v4

            - name: Instalar pnpm
              uses: pnpm/action-setup@v3
              with:
                  version: 9

            - name: Configurar Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Instalar dependencias
              run: pnpm install

            - name: Construir el proyecto con Astro
              run: pnpm build

            - name: Cargar artefactos de producción
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./dist

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        needs: build
        runs-on: ubuntu-latest
        name: Deploy
        steps:
            - name: Publicar en GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
